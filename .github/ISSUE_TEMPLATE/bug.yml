name: Bug report
description: Something in the CLI, MCP server, site or harness does not work.
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where?
      options:
        - CLI (cli/crafterwiki.mjs)
        - MCP server (mcp/server.mjs)
        - Website (web/)
        - Static API (/api/v0)
        - Claude Code plugin / harness (/hack-plan, skills, agents)
        - Validator or corpus tooling
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and the real output, not a summary.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "node --version"
